<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Happy Anniversary</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--maroon:#4a0a18;--deep:#1d0309;--gold:#f2c14e;--saffron:#ff8a1f;--rose:#ffd9c2;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 45%,var(--maroon),var(--deep) 78%);color:var(--rose);font-family:'Cormorant Garamond',Georgia,serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:5vh 20px 3vh;pointer-events:none}
.reveal{opacity:0;transform:translateY(14px) scale(.96);transition:opacity 1.2s ease,transform 1.2s ease}
.show .reveal{opacity:1;transform:none}
h1{font-family:'Cinzel Decorative',Georgia,serif;font-size:clamp(28px,5.5vw,56px);margin:0;line-height:1.1;color:var(--gold);text-shadow:0 0 30px rgba(255,138,31,.55)}
.names{font-size:clamp(22px,4.5vw,38px);font-style:italic;margin:8px 0 0}
.msg{max-width:34ch;font-size:clamp(17px,3vw,23px);line-height:1.45;margin:0 0 12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="reveal">
    <h1>Happy Anniversary</h1>
    <p class="names" id="names">Akka &amp; Bava</p>
  </div>
  <p class="msg reveal" id="msg"></p>
</div>
<script>
/* ===== EDIT HERE ===== */
var CONFIG={
  names:"Akka & Bava",
  message:"May your love keep growing, one more beautiful year every year.",
  /* Put your photo here. Best: a base64 data URL ("data:image/jpeg;base64,...").
     A file name like "photo.jpg" also works when the page is hosted online (not double-clicked from a folder). */
  photo:""
};
/* ===================== */
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var PI=Math.PI;
var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
var scene=new THREE.Scene();
var cam=new THREE.PerspectiveCamera(50,1,.1,100);
scene.add(new THREE.AmbientLight(0xffe6c8,.85));
var dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(2,5,6);scene.add(dl);

function toon(c){return new THREE.MeshToonMaterial({color:c})}
var OL=new THREE.MeshBasicMaterial({color:0x1a0508,side:THREE.BackSide});
function sp(r){return new THREE.SphereGeometry(r,20,16)}
function cyl(a,b,h){return new THREE.CylinderGeometry(a,b,h,24)}
function tor(r,t,arc){return new THREE.TorusGeometry(r,t,8,28,arc||PI*2)}
function box(x,y,z){return new THREE.BoxGeometry(x,y,z)}
function part(geo,col,x,y,z,par,o){o=o||{};var m=new THREE.Mesh(geo,toon(col));m.position.set(x,y,z);
  if(o.s)m.scale.set(o.s[0],o.s[1],o.s[2]);if(o.r)m.rotation.set(o.r[0],o.r[1],o.r[2]);
  if(!o.n){var ol=new THREE.Mesh(geo,OL);ol.scale.setScalar(1.07);m.add(ol)}
  par.add(m);return m}

/* cartoon couple in wedding suits */
var SKIN=0xd2915e,GOLD=0xf2c14e,ROSE=0xe0345a,BLK=0x1a1a1f,WHT=0xfffaf0;
function makeChar(f){
  var g=new THREE.Group(),c={g:g};
  function arm(x,col){var p=new THREE.Group();p.position.set(x,2.15,0);
    part(cyl(.11,.1,.9),col,0,-.45,0,p);part(sp(.12),SKIN,0,-.97,0,p);g.add(p);return p}
  var h=new THREE.Group();h.position.y=2.8;g.add(h);
  part(sp(.5),SKIN,0,0,0,h,{s:[1,1.05,1]});
  [-1,1].forEach(function(s){
    part(sp(.1),0xffffff,s*.18,.05,.42,h,{s:[1,1.1,.5],n:1});
    part(sp(.055),0x111111,s*.18,.05,.5,h,{n:1});
    part(sp(.08),0xff8fa0,s*.3,-.12,.4,h,{s:[1,.8,.4],n:1});
  });
  part(tor(.13,.025,PI),0x8a1020,0,-.1,.47,h,{r:[0,0,PI],n:1});
  if(f){ /* white wedding gown */
    c.skirt=part(cyl(.4,1.0,1.4),WHT,0,.8,0,g);
    part(tor(.98,.05),GOLD,0,.14,0,g,{r:[PI/2,0,0],n:1});
    c.feet=[part(sp(.13),SKIN,-.22,.08,.6,g),part(sp(.13),SKIN,.22,.08,.6,g)];
    part(cyl(.32,.4,.95),0xffffff,0,1.85,0,g);
    part(tor(.38,.05),ROSE,0,1.5,0,g,{r:[PI/2,0,0],n:1});
    part(tor(.25,.035),0xf4f4f4,0,2.28,.02,g,{r:[PI/2,0,0],n:1});
    part(sp(.54),0x15090a,0,.08,-.12,h,{s:[1,1.05,1]});
    part(sp(.2),0x15090a,0,.45,-.35,h);
    part(sp(.6),0xf3f3ff,0,-.5,-.5,h,{s:[.95,1.6,.18],n:1});
    part(tor(.3,.03,PI),GOLD,0,.4,.12,h,{r:[.35,0,0],n:1});
    [-1,1].forEach(function(s){part(sp(.06),0xffffff,s*.5,-.15,0,h,{n:1})});
    c.armL=arm(-.5,0xffffff);c.armR=arm(.5,0xffffff);
    part(sp(.17),ROSE,0,-1.05,.08,c.armL,{n:1});
  }else{ /* black tuxedo */
    c.legs=[-.2,.2].map(function(x){var p=new THREE.Group();p.position.set(x,1.4,0);
      part(cyl(.16,.13,1.3),BLK,0,-.65,0,p);
      part(sp(.17),0x050505,0,-1.3,.1,p,{s:[1,.6,1.6]});g.add(p);return p});
    part(cyl(.38,.42,.95),BLK,0,1.85,0,g);
    part(box(.22,.7,.05),0xffffff,0,1.92,.4,g,{n:1});
    [-1,1].forEach(function(s){
      part(box(.1,.75,.05),0x30303a,s*.17,1.9,.4,g,{r:[0,0,-s*.18],n:1});
      part(sp(.09),0xc1121f,s*.1,2.28,.4,g,{s:[1.4,.8,.7],n:1})});
    part(sp(.05),0xc1121f,0,2.28,.42,g,{n:1});
    part(sp(.06),ROSE,.22,2.1,.42,g,{n:1});
    part(sp(.52),0x15090a,0,.12,-.08,h);
    [-1,1].forEach(function(s){part(sp(.07),0x15090a,s*.1,-.04,.5,h,{s:[2,.5,.7],r:[0,0,-s*.3],n:1})});
    c.armL=arm(-.5,BLK);c.armR=arm(.5,BLK);
  }
  g.scale.setScalar(.55);scene.add(g);
  var sh=new THREE.Mesh(new THREE.CircleGeometry(.75,20),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.35}));
  sh.rotation.x=-PI/2;sh.position.y=-1.94;scene.add(sh);c.sh=sh;
  return c}
var bride=makeChar(true),groom=makeChar(false);

/* rangoli floor */
var fl=new THREE.Group();fl.position.y=-1.96;fl.rotation.x=-PI/2;scene.add(fl);
function disc(r,col,z){var m=new THREE.Mesh(new THREE.CircleGeometry(r,64),new THREE.MeshBasicMaterial({color:col}));m.position.z=z;fl.add(m)}
disc(6,0x5a0f1f,0);disc(4.4,0x3a0612,.001);
[[5.2,GOLD],[4,0xff8a1f],[3,ROSE]].forEach(function(a,k){
  var n=18+k*4;for(var i=0;i<n;i++){var t=i/n*PI*2;
    var m=new THREE.Mesh(new THREE.CircleGeometry(.16,12),new THREE.MeshBasicMaterial({color:a[1]}));
    m.position.set(Math.cos(t)*a[0],Math.sin(t)*a[0],.002);fl.add(m)}
  var rg=new THREE.Mesh(new THREE.RingGeometry(a[0]-.5,a[0]-.46,64),new THREE.MeshBasicMaterial({color:a[1]}));rg.position.z=.002;fl.add(rg)});

/* big heart with photo slot */
var hs=new THREE.Shape();
hs.moveTo(0,-1);hs.bezierCurveTo(-.2,-.8,-1.1,-.2,-1.05,.35);hs.bezierCurveTo(-1,.9,-.3,1,0,.5);
hs.bezierCurveTo(.3,1,1,.9,1.05,.35);hs.bezierCurveTo(1.1,-.2,.2,-.8,0,-1);
var hg=new THREE.ExtrudeGeometry(hs,{depth:.35,bevelEnabled:true,bevelThickness:.1,bevelSize:.08,bevelSegments:4,curveSegments:40});
hg.computeBoundingBox();
var bb=hg.boundingBox,bw=bb.max.x-bb.min.x,bh=bb.max.y-bb.min.y;
var hp_=hg.attributes.position,huv=hg.attributes.uv;
for(var i=0;i<hp_.count;i++)huv.setXY(i,(hp_.getX(i)-bb.min.x)/bw,(hp_.getY(i)-bb.min.y)/bh);
huv.needsUpdate=true;
hg.translate(-(bb.min.x+bw/2),-(bb.min.y+bh/2),-.175);
var redMat=new THREE.MeshStandardMaterial({color:0xd81e3c,roughness:.3,metalness:.1,emissive:0x440010});
var heart=new THREE.Mesh(hg,[redMat,redMat]);heart.visible=false;scene.add(heart);
var gc=document.createElement('canvas');gc.width=gc.height=128;var gx=gc.getContext('2d');
var gr=gx.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,90,110,.75)');gr.addColorStop(1,'rgba(255,90,110,0)');
gx.fillStyle=gr;gx.fillRect(0,0,128,128);
var halo=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(gc),transparent:true,depthWrite:false}));
halo.scale.set(10,10,1);halo.visible=false;scene.add(halo);

function setPhoto(img){
  var W=640,H=Math.round(W*bh/bw),cv=document.createElement('canvas');cv.width=W;cv.height=H;
  var x=cv.getContext('2d'),k=Math.max(W/img.width,H/img.height),dw=img.width*k,dh=img.height*k;
  x.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
  try{x.getImageData(0,0,1,1)}catch(e){console.warn('Photo blocked by the browser. Use a base64 data URL.');return}
  heart.material=[new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv)}),redMat];
}
if(CONFIG.photo){var im=new Image();im.onload=function(){setPhoto(im)};im.onerror=function(){console.warn('Photo could not be loaded')};im.src=CONFIG.photo}

/* petals */
var N=matchMedia('(max-width:600px)').matches?120:220;
var petal=new THREE.InstancedMesh(new THREE.SphereGeometry(.13,10,8),new THREE.MeshBasicMaterial({color:0xffffff}),N);
petal.visible=false;scene.add(petal);
var P=[],d=new THREE.Object3D(),pc=[0xff8a1f,0xffb300,ROSE];
function reset(o){o.x=(Math.random()-.5)*14;o.y=6+Math.random()*5;o.z=(Math.random()-.5)*6;o.v=.015+Math.random()*.02;o.r=Math.random()*6;o.s=.6+Math.random()*.9;o.w=Math.random()*6}
for(var i=0;i<N;i++){var o={};reset(o);P.push(o);petal.setColorAt(i,new THREE.Color(pc[i%3]))}
petal.instanceColor.needsUpdate=true;

/* small floating hearts */
var hc=document.createElement('canvas');hc.width=hc.height=64;
var cx=hc.getContext('2d');cx.fillStyle='#ff4d6d';cx.beginPath();cx.moveTo(32,56);
cx.bezierCurveTo(2,34,6,6,32,18);cx.bezierCurveTo(58,6,62,34,32,56);cx.fill();
var htex=new THREE.CanvasTexture(hc),H=[];
for(var i=0;i<26;i++){var s=new THREE.Sprite(new THREE.SpriteMaterial({map:htex,transparent:true,opacity:0}));s.visible=false;s.life=0;scene.add(s);H.push(s)}

/* timeline */
function cl(x){return Math.max(0,Math.min(1,x))}
function ease(x){x=cl(x);return x*x*(3-2*x)}
var T=0,last=performance.now(),cel=false,hsT=0;
if(matchMedia('(prefers-reduced-motion: reduce)').matches)T=5.6;
function size(){var w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;
  cam.position.set(0,1.6,w<h?17:9.5);cam.lookAt(0,.8,0);cam.updateProjectionMatrix()}
addEventListener('resize',size);size();

document.getElementById('names').textContent=CONFIG.names;document.getElementById('msg').textContent=CONFIG.message;

var MX=2.9,FACE=PI/2-.4;
function loop(){
  requestAnimationFrame(loop);
  var now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  var u=cl(T/4.4),p=1-Math.pow(1-u,1.6);
  var turn=ease((T-4.2)/.8),blend=ease((T-4.6)/.7),amp=1-turn,ph=T*7;
  var jump=blend>.9?Math.abs(Math.sin((T-5.3)*4))*.1:0;
  var bob=Math.abs(Math.sin(ph))*.05*amp+jump;
  var wave=Math.sin(T*8)*.3*blend,sw=Math.sin(ph)*.55*amp;
  bride.g.position.set(-9+(9-MX)*p,-1.95+bob,0);bride.g.rotation.y=FACE+(.3-FACE)*turn;
  groom.g.position.set(9-(9-MX)*p,-1.95+bob,0);groom.g.rotation.y=-(FACE+(.3-FACE)*turn);
  bride.sh.position.x=bride.g.position.x;groom.sh.position.x=groom.g.position.x;
  bride.sh.scale.setScalar(1-jump*2);groom.sh.scale.setScalar(1-jump*2);
  bride.armL.rotation.set(sw*(1-blend),0,-2.6*blend+wave);
  bride.armR.rotation.set(-sw*(1-blend),0,1.3*blend);
  groom.armL.rotation.set(sw*(1-blend),0,-1.3*blend);
  groom.armR.rotation.set(-sw*(1-blend),0,2.6*blend+wave);
  groom.legs[0].rotation.x=Math.sin(ph)*.7*amp;groom.legs[1].rotation.x=-Math.sin(ph)*.7*amp;
  bride.feet[0].position.z=.6+Math.sin(ph)*.3*amp;bride.feet[1].position.z=.6-Math.sin(ph)*.3*amp;
  bride.skirt.rotation.z=Math.sin(ph)*.03*amp;

  /* hovering heart */
  var hp=ease((T-3.9)/1);heart.visible=halo.visible=hp>0;
  var sc=2.2*(hp+Math.sin(hp*PI)*.2)*(1+Math.sin(T*3)*.03);
  var hy=.5+Math.sin(T*1.8)*.2;
  heart.scale.setScalar(sc);heart.position.set(0,hy,0);
  heart.rotation.set(Math.sin(T*1.3)*.06,Math.sin(T*1.1)*.3,Math.sin(T*1.5)*.05);
  halo.position.set(0,hy,-.6);halo.material.opacity=hp*(.7+Math.sin(T*3)*.15);

  if(T>4.6&&!cel){cel=true;petal.visible=true;P.forEach(reset)}
  if(T>5&&!document.body.classList.contains('show'))document.body.classList.add('show');
  if(cel){
    hsT+=dt;if(hsT>.35){hsT=0;for(var i=0;i<H.length;i++)if(!H[i].visible){var s=H[i];s.visible=true;s.life=1;
      s.position.set((Math.random()-.5)*5,1.2+Math.random()*.6,(Math.random()-.5)*.8);s.userData.sx=Math.random()*6;break}}
    for(var i=0;i<N;i++){var o=P[i];o.y-=o.v;o.x+=Math.sin(T*2+o.w)*.004;if(o.y<-2)reset(o);
      d.position.set(o.x,o.y,o.z);d.rotation.set(o.r+T*o.s,o.r*.5+T*o.s*.7,0);d.scale.set(1,.45,1.5);d.updateMatrix();petal.setMatrixAt(i,d.matrix)}
    petal.instanceMatrix.needsUpdate=true;
  }
  H.forEach(function(s){if(!s.visible)return;s.life-=dt*.35;if(s.life<=0){s.visible=false;return}
    s.position.y+=dt*.9;s.position.x+=Math.sin(T*3+s.userData.sx)*.006;
    s.material.opacity=Math.min(1,s.life*2);var k=.35+(1-s.life)*.35;s.scale.set(k,k,k)});
  renderer.render(scene,cam);
}
loop();
})();
</script>
</body>
</html>
